# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "neurobot-community"

[setup]
script = "npm install"

[setup.win32]
script = '''
Write-Host "Preparando entorno de Neurobot..."

# Dependencias de Python
if (Test-Path "requirements.txt") {
    Write-Host "Instalando dependencias de Python..."
    python -m pip install -r requirements.txt
}

# Dependencias de Node.js
if (Test-Path "package-lock.json") {
    Write-Host "Instalando dependencias de Node..."
    npm ci
}
elseif (Test-Path "package.json") {
    Write-Host "Instalando dependencias de Node..."
    npm install
}

Write-Host "Entorno preparado correctamente."'''

[[actions]]
name = "Iniciar proyecto"
icon = "tool"
command = '''
if (Test-Path "package.json") {
    $package = Get-Content "package.json" -Raw | ConvertFrom-Json

    if ($package.scripts.dev) {
        npm run dev
    }
    elseif ($package.scripts.start) {
        npm start
    }
}
elseif (Test-Path "app.py") {
    python app.py
}
elseif (Test-Path "manage.py") {
    python manage.py runserver
}
else {
    Write-Host "No pude detectar automáticamente cómo iniciar el proyecto."
}'''
platform = "win32"

[[actions]]
name = "Pruebas"
icon = "tool"
command = '''
if (Test-Path "package.json") {
    $package = Get-Content "package.json" -Raw | ConvertFrom-Json

    if ($package.scripts.test) {
        npm test
    }
}

if (Test-Path "pytest.ini" -or Test-Path "requirements.txt") {
    python -m pytest
}'''
