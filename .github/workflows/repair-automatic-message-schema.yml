name: Repair automatic message schema

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, 'ejecutar reparación de esquema automático') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted TypeScript repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/admin/server-base.ts')
          text = path.read_text(encoding='utf-8')

          old_schema = """        reconciliationIntervalSeconds: z.number().int().min(60).max(3600).default(120),
                  template: welcomeTemplateSchema,"""
          new_schema = """        reconciliationIntervalSeconds: z.number().int().min(60).max(3600).default(120),
                  scheduleTimes: z
                    .array(z.string().regex(/^(?:[01]\\d|2[0-3]):[0-5]\\d$/u))
                    .min(1, 'Agrega al menos un horario de bienvenida.')
                    .max(8)
                    .refine((times) => new Set(times).size === times.length, 'Los horarios no pueden repetirse.')
                    .default([...DEFAULT_AUTOMATIC_MESSAGE_CONFIGURATION.welcome.scheduleTimes]),
                  template: welcomeTemplateSchema,"""
          if old_schema not in text:
              raise SystemExit('No se encontró el esquema de bienvenida esperado.')
          text = text.replace(old_schema, new_schema, 1)

          old_normalization = """          sendDelaySeconds: WELCOME_BATCH_WINDOW_SECONDS,
                    template: assertPlainText(configurationInput.welcome.template),"""
          new_normalization = """          sendDelaySeconds: WELCOME_BATCH_WINDOW_SECONDS,
                    scheduleTimes: [...configurationInput.welcome.scheduleTimes].sort(),
                    template: assertPlainText(configurationInput.welcome.template),"""
          if old_normalization not in text:
              raise SystemExit('No se encontró la normalización de bienvenida esperada.')
          text = text.replace(old_normalization, new_normalization, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f src/persistence/automatic-message-compatibility.d.ts
          rm -f .github/workflows/repair-automatic-message-schema.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementar bienvenidas agrupadas por horario: corregir esquema administrativo"
          git push origin HEAD:main
