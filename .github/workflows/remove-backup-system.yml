name: Remove backup system

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/refactor-neurobot-community' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout community branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load verified transformation
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/Luis-Tureo/neurobot-business/c2bffc53e0c8a58aa0f9db2d60f0d5d9ae3c7cee/scripts/remove-backup-system.py --output scripts/remove-backup-system.py

      - name: Remove backup system
        run: python scripts/remove-backup-system.py

      - name: Format changed files
        shell: bash
        run: |
          paths=(src/core/maintenance-service.ts src/core/whatsapp-session-manager.ts src/index.ts src/admin/server.ts src/persistence/database.ts tests/maintenance-service.test.ts tests/maintenance-api.test.ts tests/no-backup-system.test.ts public README.md)
          if [ -d docs ]; then paths+=(docs); fi
          npx prettier --write "${paths[@]}"

      - name: Commit refactor
        shell: bash
        run: |
          rm -f scripts/remove-backup-system.py .github/workflows/remove-backup-system.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar sistema de respaldos"
          git push origin HEAD:agent/refactor-neurobot-community

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
