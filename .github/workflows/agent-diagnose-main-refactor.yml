name: Diagnose main refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-diagnose-main-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Reproduce and capture failure
        shell: bash
        run: |
          set +e
          report=/tmp/refactor-diagnostic.txt
          : > "$report"
          python - <<'PY' >> "$report" 2>&1
          from pathlib import Path
          source = Path('.github/workflows/agent-apply-main-refactor.yml').read_text(encoding='utf-8')
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-refactor.py').write_text(code, encoding='utf-8')
          print(f'Extracted {len(lines)} Python lines.')
          PY
          extract_status=$?
          echo "extract_status=$extract_status" >> "$report"

          if [ "$extract_status" -eq 0 ]; then
            python /tmp/apply-refactor.py >> "$report" 2>&1
            patch_status=$?
          else
            patch_status=99
          fi
          echo "patch_status=$patch_status" >> "$report"

          if [ "$patch_status" -eq 0 ]; then
            npm ci >> "$report" 2>&1
            install_status=$?
            echo "install_status=$install_status" >> "$report"
            if [ "$install_status" -eq 0 ]; then
              npx prettier --write src public tests docs README.md .github/workflows/validate-main.yml >> "$report" 2>&1
              prettier_status=$?
              echo "prettier_status=$prettier_status" >> "$report"
              npm run check >> "$report" 2>&1
              check_status=$?
              echo "check_status=$check_status" >> "$report"
            fi
          fi

          cp "$report" /tmp/refactor-diagnostic-final.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/refactor-diagnostic-final.txt refactor-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refactor-diagnostic.txt
          git commit -m 'chore: publish refactor diagnostic'
          git push origin HEAD:main
