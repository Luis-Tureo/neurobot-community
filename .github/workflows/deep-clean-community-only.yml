name: Deep Clean Neurobot Community
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
jobs:
  clean:
    if: github.event.issue.title == '[deep-clean-community-only]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply deep cleanup
        run: |
          set -euo pipefail
          python scripts/deep-clean-community-only.py
          npx prettier --write \
            src/domain/types.ts src/core/profile-presets.ts src/persistence/database.ts \
            src/core/multi-bot-manager.ts src/core/bot-instance.ts src/admin/server.ts \
            public/index.html public/multibot-panel.js tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove commercial domain and panel modules" || true
          git push origin HEAD:agent/refactor-neurobot-community
      - name: Validate
        id: validation
        shell: bash
        run: |
          set +e
          : > report.txt
          run_step(){ name="$1"; shift; echo "## $name" >> report.txt; echo '```text' >> report.txt; "$@" >> report.txt 2>&1; code=$?; echo '```' >> report.txt; echo "Exit code: $code" >> report.txt; echo >> report.txt; return $code; }
          result=0
          run_step "npm ci" npm ci || result=1
          if [ "$result" -eq 0 ]; then run_step "Typecheck" npm run typecheck || result=1; fi
          if [ "$result" -eq 0 ]; then run_step "Lint" npm run lint || result=1; fi
          if [ "$result" -eq 0 ]; then run_step "Tests" npm test || result=1; fi
          if [ "$result" -eq 0 ]; then run_step "Build" npm run build || result=1; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish report
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.validation.outputs.result }}
        with:
          script: |
            const fs=require('fs'); let report=fs.readFileSync('report.txt','utf8'); if(report.length>60000) report=report.slice(0,60000)+'\n\n[Registro truncado]';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`${process.env.RESULT==='0'?'✅ Limpieza profunda validada':'❌ La limpieza profunda requiere correcciones'}\n\n${report}`});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
      - if: steps.validation.outputs.result != '0'
        run: exit 1
