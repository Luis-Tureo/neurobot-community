name: Agent Community Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-community-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture repository inventory
        shell: bash
        run: |
          rm -rf agent-audit agent-transfer
          mkdir -p agent-audit agent-transfer
          find . -path './.git' -prune -o -path './node_modules' -prune -o -path './agent-audit' -prune -o -path './agent-transfer' -prune -o -type f -print | sort > agent-audit/files.txt
          git log --oneline -60 > agent-audit/recent-commits.txt
          {
            echo '# Feature search'
            echo
            for term in 'daily summary' 'weekly summary' 'resumen diario' 'resumen semanal' 'chat history' 'historial' 'moderation' 'moderación' 'warning' 'advertencia' 'welcome batch' 'bienvenidos nuevos integrantes' 'automation test' 'probar automatizaciones' 'group_participants_changed' 'daily-summary' 'weekly-summary'; do
              echo "## $term"
              grep -RniI --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=agent-audit --exclude-dir=agent-transfer --exclude='package-lock.json' "$term" . || true
              echo
            done
          } > agent-audit/feature-search.txt

      - name: Run validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee agent-audit/npm-check.txt

      - name: Package source snapshot
        shell: bash
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./agent-audit' \
            --exclude='./agent-transfer' \
            -czf /tmp/neurobot-community-source.tar.gz .
          base64 -w 76 /tmp/neurobot-community-source.tar.gz > /tmp/source.tar.gz.b64
          split -b 180k -d -a 3 /tmp/source.tar.gz.b64 agent-transfer/source.part.
          sha256sum /tmp/neurobot-community-source.tar.gz > agent-transfer/source.sha256
          wc -c /tmp/neurobot-community-source.tar.gz /tmp/source.tar.gz.b64 > agent-transfer/source.sizes.txt

      - name: Commit audit bundle to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-audit agent-transfer
          git commit -m 'chore: publish temporary community audit snapshot'
          git push origin HEAD:main

      - name: Fail if validation failed
        if: steps.validation.outcome != 'success'
        run: exit 1
