name: Validate Neurobot Community Refactor

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.title == '[validate-community-refactor]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate and capture report
        id: validate
        shell: bash
        run: |
          set +e
          : > community-validation-report.txt
          run_step() {
            name="$1"
            shift
            echo "## $name" >> community-validation-report.txt
            echo '```text' >> community-validation-report.txt
            "$@" >> community-validation-report.txt 2>&1
            status=$?
            echo '```' >> community-validation-report.txt
            echo "Exit code: $status" >> community-validation-report.txt
            echo >> community-validation-report.txt
            return $status
          }

          overall=0
          run_step "npm ci" npm ci || overall=1
          if [ "$overall" -eq 0 ]; then run_step "Typecheck" npm run typecheck || overall=1; fi
          if [ "$overall" -eq 0 ]; then run_step "Lint" npm run lint || overall=1; fi
          if [ "$overall" -eq 0 ]; then run_step "Tests" npm test || overall=1; fi
          if [ "$overall" -eq 0 ]; then run_step "Build" npm run build || overall=1; fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish report
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.validate.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('community-validation-report.txt', 'utf8');
            if (report.length > 60000) report = `${report.slice(0,60000)}\n\n[Registro truncado]`;
            const heading = process.env.RESULT === '0'
              ? '✅ Validación comunitaria completada'
              : '❌ La validación comunitaria encontró errores';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${heading}\n\n${report}` });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });

      - name: Fail when validation failed
        if: steps.validate.outputs.overall != '0'
        run: exit 1
