name: Deploy Neurobot to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_container:
        description: 'Cambiar Azure App Service para usar la imagen publicada'
        required: false
        default: false
        type: boolean

# Evita que varios pushes consecutivos publiquen o desplieguen fuera de orden.
concurrency:
  group: neurobot-container-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AZURE_CLIENT_ID: 08de1185-b271-4533-9583-b43599f9d283
  AZURE_TENANT_ID: 3bb118c0-bb1e-4418-87e5-d176550897cb
  AZURE_SUBSCRIPTION_ID: c8f1120a-a5f2-4c59-be76-e3118c5f03ce
  AZURE_RESOURCE_GROUP: neurobot-community-ltureo
  AZURE_WEBAPP_NAME: neurobot-community
  NODE_VERSION: 24.19.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/luis-tureo/neurobot-community
  TZ: America/Santiago

jobs:
  build-publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show checked out revision
        run: |
          echo "Workflow ref: ${GITHUB_REF}"
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Checked out SHA: $(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las pruebas, lint y typecheck se ejecutan una sola vez en un entorno limpio.
      # El Dockerfile se limita después a compilar y validar el artefacto de runtime.
      - name: Verify project
        run: npm run check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login to Azure with OIDC
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_container)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure persistent Azure container runtime
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_container)
        shell: bash
        run: |
          set -euo pipefail

          # LocalAuth guarda el perfil Chromium en /home. Un restart directo puede
          # solapar por unos segundos el contenedor anterior y el nuevo usando el
          # mismo perfil. Detener primero garantiza un único propietario del perfil.
          APP_STOPPED=false
          restore_app_on_failure() {
            if [ "$APP_STOPPED" = "true" ]; then
              echo "El despliegue falló con la Web App detenida; intentando volver a iniciarla."
              az webapp start \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                >/dev/null || true
            fi
          }
          trap restore_app_on_failure EXIT

          echo "Deteniendo Azure App Service antes de reemplazar la imagen..."
          az webapp stop \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            >/dev/null
          APP_STOPPED=true

          for attempt in $(seq 1 18); do
            STATE=$(az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query state \
              --output tsv)
            if [ "$STATE" = "Stopped" ]; then
              echo "Azure App Service detenido correctamente."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "ERROR: Azure no confirmó el estado Stopped dentro del tiempo esperado." >&2
              exit 1
            fi
            echo "Esperando detención completa (${attempt}/18)..."
            sleep 5
          done

          az webapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --https-only true \
            >/dev/null

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              WEBSITES_PORT=8080 \
              PORT=8080 \
              PANEL_HOST=0.0.0.0 \
              DATA_ROOT=/home/neurobot \
              PUPPETEER_CACHE_DIR=/app/.cache/puppeteer \
              CHROME_EXECUTABLE_PATH=/usr/local/bin/neurobot-chrome \
              AI_PROVIDER=groq \
              GROQ_MODEL=llama-3.1-8b-instant \
            >/dev/null

          # Se despliega la etiqueta inmutable del commit, no latest, para evitar
          # que un build anterior o una caché del registro cambien el artefacto.
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "${IMAGE_NAME}:${GITHUB_SHA}" \
            --container-registry-url "https://ghcr.io" \
            --enable-app-service-storage true \
            >/dev/null

          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --always-on true \
            >/dev/null

          echo "Iniciando Azure App Service con la nueva imagen..."
          az webapp start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            >/dev/null
          APP_STOPPED=false
          trap - EXIT

      - name: Verify Azure health endpoint
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_container)
        shell: bash
        run: |
          set -euo pipefail
          HOST_NAME=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)

          echo "Esperando a que Neurobot responda en https://${HOST_NAME}/api/health"
          for attempt in $(seq 1 30); do
            if RESPONSE=$(curl --fail --silent --show-error --max-time 10 "https://${HOST_NAME}/api/health" 2>/dev/null) \
              && printf '%s' "$RESPONSE" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "Neurobot respondió correctamente."
              exit 0
            fi
            echo "Intento ${attempt}/30: el contenedor aún está iniciando."
            sleep 10
          done

          echo "ERROR: el contenedor no respondió correctamente dentro del tiempo esperado." >&2
          exit 1

      - name: Show deployed image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_container)
        run: echo "Azure configurado con ${IMAGE_NAME}:${GITHUB_SHA}"
