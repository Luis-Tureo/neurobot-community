name: Aplicar panel minimalista de comunidad

on:
  pull_request:
    branches: [main]
    paths:
      - .github/minimal-community-panel-trigger.txt

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cargar la capa minimalista
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/friendly-panel.js')
          content = path.read_text(encoding='utf-8')
          import_line = "\nvoid import('./minimal-community-panel.js');\n"
          if "minimal-community-panel.js" not in content:
              path.write_text(content.rstrip() + import_line, encoding='utf-8')
          PY

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/minimal-community-panel.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambio validado en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/friendly-panel.js
          if git diff --cached --quiet; then
            echo "La capa minimalista ya estaba cargada."
          else
            git commit -m "feat: activar panel minimalista de comunidad"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
