name: Aplicar rediseño de información del bot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/knowledge-panel-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar rediseño de información del bot
        run: python scripts/apply-knowledge-panel-redesign.py

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/knowledge-panel-ui.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios validados directamente en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/multibot-panel.js public/friendly-panel.js public/friendly-panel.css tests/knowledge-panel-ui.test.ts
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: hacer amigable la información del bot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
