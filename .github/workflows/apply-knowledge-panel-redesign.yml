name: Aplicar rediseño de información del bot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/knowledge-panel-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Corregir transformador temporal
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-knowledge-panel-redesign.py')
          content = path.read_text(encoding='utf-8')
          replacements = {
              "NEW_LOAD_KNOWLEDGE + 'async function loadCachedAnswers'": "NEW_LOAD_KNOWLEDGE",
              "NEW_FILL_ENTRY + 'async function loadMenus'": "NEW_FILL_ENTRY",
              "NEW_KNOWLEDGE_BINDINGS + \"  document.querySelector('#cached-answer-search').addEventListener('submit', async (event) => {\"": "NEW_KNOWLEDGE_BINDINGS",
              "\"function clearKnowledgeEntry() {\\n  closeKnowledgeEntryForm();\\n}\\n\\nfunction clearMenu() {\"": "\"function clearKnowledgeEntry() {\\n  closeKnowledgeEntryForm();\\n}\\n\\n\"",
              "FRIENDLY_KNOWLEDGE + '  menus: {'": "FRIENDLY_KNOWLEDGE",
              "SIMPLIFY_KNOWLEDGE + 'function simplifyMenus() {'": "SIMPLIFY_KNOWLEDGE",
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'No se encontró el patrón temporal: {old}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY

      - name: Aplicar rediseño de información del bot
        run: python scripts/apply-knowledge-panel-redesign.py

      - name: Retirar función anterior que ya no se utiliza
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/multibot-panel.js')
          content = path.read_text(encoding='utf-8')
          obsolete = "function clearKnowledgeEntry() {\n  closeKnowledgeEntryForm();\n}\n\n"
          if obsolete not in content:
              raise SystemExit('No se encontró la función obsoleta clearKnowledgeEntry.')
          path.write_text(content.replace(obsolete, '', 1), encoding='utf-8')
          PY

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/knowledge-panel-ui.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios validados directamente en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/multibot-panel.js public/friendly-panel.js public/friendly-panel.css tests/knowledge-panel-ui.test.ts
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: hacer amigable la información del bot"
            git restore scripts/apply-knowledge-panel-redesign.py
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
