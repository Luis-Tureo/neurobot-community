name: Aplicar consolidación del módulo de inicio

on:
  pull_request:
    branches: [main]
    paths:
      - .github/start-panel-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar consolidación del inicio
        run: python scripts/apply-start-panel-consolidation.py

      - name: Corregir literal de la prueba generada
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/start-panel-consolidation.test.ts')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if 'expect(refinement).toContain("qa(' in line:
                  lines[index] = "    expect(refinement).toContain('data-section=\"whatsapp\"');"
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/start-panel-consolidation.test.ts tests/friendly-panel.test.ts tests/panel-refinement.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios validados directamente en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/multibot-panel.js public/friendly-panel.js public/panel-refinement.js public/panel-refinement.css tests/friendly-panel.test.ts tests/start-panel-consolidation.test.ts
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: consolidar inicio y corregir carga del panel"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
