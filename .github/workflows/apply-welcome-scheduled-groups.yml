name: Apply scheduled welcome implementation

on:
  push:
    branches:
      - feat/welcome-scheduled-groups

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Implementar bienvenidas agrupadas por horario') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/welcome-scheduled-groups
          fetch-depth: 0

      - name: Apply implementation
        run: python3 scripts/apply-welcome-scheduled-groups.py

      - name: Commit generated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementar bienvenidas agrupadas por horario"
          git push origin HEAD:feat/welcome-scheduled-groups
