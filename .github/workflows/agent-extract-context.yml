name: Agent Extract Context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-extract-context.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract exact context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          queries={
            'src/persistence/database.ts':['public getSetting','public setSetting','public saveAutomaticMessageConfiguration','public listActiveBotGroupIds','public listGroupModerationRecipients'],
            'src/admin/server.ts':["/api/polls/send","/api/polls/test","automaticMessagesFor(","pollServiceFor(","const automaticMessagesSchema"],
            'public/index.html':['<script','Automatizaciones','section-automatic-messages','Encuestas'],
            'src/core/automatic-message-defaults.ts':['DEFAULT_AUTOMATIC_MESSAGE_CONFIGURATION'],
            'src/messaging/simulated-client.ts':['class Simulated','sendMessage','listGroups'],
          }
          out=[]
          for filename, needles in queries.items():
            lines=Path(filename).read_text(encoding='utf-8').splitlines()
            out.append(f'# {filename}')
            for needle in needles:
              indexes=[i for i,l in enumerate(lines) if needle in l]
              out.append(f'## {needle} -> {[i+1 for i in indexes]}')
              for i in indexes:
                a=max(0,i-18);b=min(len(lines),i+45)
                out.append(f'--- {a+1}-{b} ---')
                out.extend(f'{j+1:05d}: {lines[j]}' for j in range(a,b))
          Path('agent-audit/exact-context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit exact context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-audit/exact-context.txt
          git commit -m 'chore: publish temporary exact context'
          git push origin HEAD:main
