name: Validate main

on:
  push:
    branches: [main, feat/scheduled-welcome-runtime-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-feature:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/scheduled-welcome-runtime-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0
      - name: Apply baseline protection
        run: python3 scripts/purge-baseline-welcome-pending.py
      - name: Restore workflow and commit patch
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blindar línea base de bienvenida al activar"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2

  check:
    if: github.event_name != 'push' || github.ref != 'refs/heads/feat/scheduled-welcome-runtime-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          npm run runtime:check

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run check
