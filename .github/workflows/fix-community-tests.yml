name: Deep Clean Neurobot Community

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'agent/refactor-neurobot-community'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply and preserve deep cleanup
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "export type BotMode = 'community' | 'business' | 'mixed'" src/domain/types.ts; then
            python scripts/deep-clean-community-only.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove commercial domain and panel modules"
            git push origin HEAD:agent/refactor-neurobot-community
          else
            echo "La limpieza profunda ya está aplicada."
          fi
      - name: Repair transformed community UI
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/fix-community-ui-deep.py ]; then
            python scripts/fix-community-ui-deep.py
          fi
      - name: Format transformed sources
        run: |
          npx prettier --write \
            src/domain/types.ts src/core/profile-presets.ts src/persistence/database.ts \
            src/core/multi-bot-manager.ts src/core/bot-instance.ts src/admin/server.ts \
            public/index.html public/multibot-panel.js tests
      - name: Commit corrected sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: repair community-only panel after deep cleanup"
            git push origin HEAD:agent/refactor-neurobot-community
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
