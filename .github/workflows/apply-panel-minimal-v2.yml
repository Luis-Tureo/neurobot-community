name: Aplicar panel minimalista v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/panel-minimal-v2-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar rediseño
        shell: bash
        run: |
          python scripts/apply-panel-minimal-v2.py
          sed -i '1i// PANEL_MINIMAL_V2' public/panel-minimal-v2.js
          python <<'PY'
          import re
          from pathlib import Path

          panel_path = Path('public/multibot-panel.js')
          panel = panel_path.read_text(encoding='utf-8')
          panel, count = re.subn(
              r"\nasync function transferCommercialConfiguration\(bot\) \{.*?\n\}\n\nasync function sendBotToTrash",
              "\nasync function sendBotToTrash",
              panel,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se encontró la función comercial obsoleta.')

          old_mode = "['Modo', result.bot.operatingMode === 'COMMUNITY_GROUPS' ? 'Comunidad — pregunta única' : botModeLabel(result.bot.mode)],"
          if old_mode not in panel:
              raise SystemExit('No se encontró el texto antiguo del modo comunitario.')
          panel = panel.replace(old_mode, "['Modo', botModeLabel(result.bot.mode)],", 1)

          panel, count = re.subn(
              r"  const trashButton = document\.querySelector\('#maintenance-send-to-trash'\);\n"
              r"  trashButton\.disabled = result\.bot\.deletionLocked;\n"
              r"  document\.querySelector\('#assistant-trash-help'\)\.textContent = result\.bot\.deletionLocked\n"
              r"    \? .*?\n"
              r"    : .*?;\n"
              r"  const cards =",
              "  const trashButton = document.querySelector('#maintenance-send-to-trash');\n"
              "  trashButton.disabled = false;\n"
              "  document.querySelector('#assistant-trash-help').textContent = '';\n"
              "  const cards =",
              panel,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se encontró el bloque visual de protección antigua.')
          panel_path.write_text(panel, encoding='utf-8')

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(
              r'\s*<p[^>]*>\s*Las preguntas frecuentes aprobadas tienen prioridad\..*?</p>',
              '',
              index,
              count=1,
              flags=re.S | re.I,
          )
          index = re.sub(
              r'\s*<p[^>]*>\s*El historial se ordena automáticamente.*?</p>',
              '',
              index,
              count=1,
              flags=re.S | re.I,
          )
          index = re.sub(r'\s*<h[234][^>]*>\s*Preguntas respondidas\s*</h[234]>', '', index, count=1, flags=re.I)
          index_path.write_text(index, encoding='utf-8')

          refinement_path = Path('public/panel-minimal-v2.js')
          refinement = refinement_path.read_text(encoding='utf-8')
          marker = '// PANEL_MINIMAL_V2\n'
          stylesheet_loader = """const panelV2StylesheetHref = '/panel-minimal-v2.css';
          if (!document.querySelector(`link[href="${panelV2StylesheetHref}"]`)) {
            const panelV2Stylesheet = document.createElement('link');
            panelV2Stylesheet.rel = 'stylesheet';
            panelV2Stylesheet.href = panelV2StylesheetHref;
            document.head.append(panelV2Stylesheet);
          }

          """
          if marker not in refinement:
              raise SystemExit('No se encontró el marcador del refinamiento final.')
          refinement = refinement.replace(marker, marker + stylesheet_loader, 1)
          refinement = re.sub(
              r"\n\s*if \(textIncludes\(paragraph, /Las preguntas frecuentes aprobadas tienen prioridad/iu\)\) hideV2\(paragraph\);",
              '',
              refinement,
              count=1,
          )
          refinement_path.write_text(refinement, encoding='utf-8')

          usability_path = Path('tests/panel-usability.test.ts')
          usability = usability_path.read_text(encoding='utf-8')
          old_phone_expectation = "    expect(panel).toContain(\"assistant.phoneNumber || 'Sin vincular'\");"
          if old_phone_expectation not in usability:
              raise SystemExit('No se encontró la expectativa antigua del número en restauración.')
          usability = usability.replace(
              old_phone_expectation,
              "    expect(panel).not.toContain(\"assistant.phoneNumber || 'Sin vincular'\");",
              1,
          )
          usability_path.write_text(usability, encoding='utf-8')

          admin_path = Path('tests/admin-server.test.ts')
          admin = admin_path.read_text(encoding='utf-8')
          old_admin = """    const protectedAssistant = await injectAuthenticated(app, auth, {
                method: 'POST',
                url: '/api/bots/neurobot/trash',
                payload: { password: 'contraseña-de-prueba', confirmationName: 'Neurobot' },
              });
              expect(protectedAssistant.statusCode).toBe(403);
          """
          new_admin = """    const archivedNeurobot = await injectAuthenticated(app, auth, {
                method: 'POST',
                url: '/api/bots/neurobot/trash',
                payload: { password: 'contraseña-de-prueba', confirmationName: 'Neurobot' },
              });
              expect(archivedNeurobot.statusCode).toBe(200);
              expect(database.getBot('neurobot')?.lifecycleStatus).toBe('ARCHIVED');

              const restoredNeurobot = await injectAuthenticated(app, auth, {
                method: 'POST',
                url: '/api/bots/neurobot/restore',
                payload: { confirmed: true },
              });
              expect(restoredNeurobot.statusCode).toBe(200);
              expect(database.getBot('neurobot')).toMatchObject({ lifecycleStatus: 'DISABLED', enabled: false });
          """
          old_admin = re.sub(r'^\s{10}', '', old_admin, flags=re.M)
          new_admin = re.sub(r'^\s{10}', '', new_admin, flags=re.M)
          if old_admin not in admin:
              raise SystemExit('No se encontró la expectativa antigua de protección en la API.')
          admin = admin.replace(old_admin, new_admin, 1)
          admin = admin.replace(
              "it('rechaza módulos comunitarios en un negocio y protege la papelera'",
              "it('rechaza módulos comunitarios en un negocio y permite restaurar asistentes'",
              1,
          )
          admin_path.write_text(admin, encoding='utf-8')

          generated_test_path = Path('tests/panel-minimal-v2.test.ts')
          generated_test = generated_test_path.read_text(encoding='utf-8')
          generated_test = generated_test.replace(
              "expect(refinement).toContain('Las preguntas frecuentes aprobadas tienen prioridad');",
              "expect(refinement).not.toContain('Las preguntas frecuentes aprobadas tienen prioridad');",
              1,
          )
          generated_test = generated_test.replace(
              "expect(loader).toContain(\"import('./panel-minimal-v2.js')\");",
              "expect(loader).toContain(\"import('./panel-minimal-v2.js')\");\n    expect(refinement).toContain(\"panelV2StylesheetHref = '/panel-minimal-v2.css'\");",
              1,
          )
          generated_test = generated_test.replace(
              "expect(html).not.toContain('Comunidad — pregunta única');",
              "expect(html).not.toContain('Comunidad — pregunta única');\n    expect(panel).not.toContain('Comunidad — pregunta única');",
              1,
          )
          generated_test_path.write_text(generated_test, encoding='utf-8')
          PY

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar pruebas principales del panel
        run: npm test -- tests/panel-minimal-v2.test.ts tests/assistant-platform.test.ts tests/friendly-panel.test.ts tests/panel-refinement.test.ts tests/panel-usability.test.ts tests/admin-server.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios validados en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/app.js \
            public/index.html \
            public/minimal-community-panel.js \
            public/multibot-panel.js \
            public/panel-minimal-v2.js \
            public/panel-minimal-v2.css \
            src/admin/server.ts \
            src/persistence/database.ts \
            tests/admin-server.test.ts \
            tests/assistant-platform.test.ts \
            tests/panel-usability.test.ts \
            tests/panel-minimal-v2.test.ts
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: simplificar panel y restauración de asistentes"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
