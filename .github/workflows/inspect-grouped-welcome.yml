name: Inspect grouped welcome

on:
  push:
    branches:
      - agent/grouped-welcome-default
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate welcome configuration and tests
        shell: bash
        run: |
          set -euo pipefail
          echo '=== welcome settings references ==='
          grep -RInE 'sendDelaySeconds|batchWindowSeconds|multipleJoinMode|maximumGroupedNames|includePublicName|enableRealMention' src public tests README.md || true
          echo '=== welcome form controls ==='
          grep -nE 'welcome_batch_window|welcome_multiple_mode|welcome_maximum_names|welcome_send_delay|welcome_group_simultaneous' public/index.html public/app.js || true
          echo '=== automatic messages routes ==='
          grep -nE "automatic-messages|automaticMessagesSchema|saveAutomaticMessageConfiguration" src/admin/server.ts src/persistence/database.ts || true
          echo '=== relevant test names ==='
          grep -nE "agrupa varias personas|bienvenida|multipleJoinMode|sendDelaySeconds|batchWindowSeconds" tests/automatic-message-service.test.ts tests/automatic-messages-ui.test.ts tests/database.test.ts || true
