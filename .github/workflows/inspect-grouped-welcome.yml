name: Apply fixed grouped welcome

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/grouped-welcome-default
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply implementation
        run: gzip -dc scripts/apply-grouped-welcome.py.gz | python

      - name: Format changed files
        run: |
          npx prettier --write \
            src/core/automatic-message-defaults.ts \
            src/core/automatic-message-service.ts \
            src/admin/server.ts \
            src/persistence/database.ts \
            public/index.html \
            public/app.js \
            tests/automatic-message-service.test.ts \
            tests/automatic-messages-ui.test.ts \
            tests/database.test.ts \
            README.md

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

      - name: Publish implementation
        run: |
          rm .github/workflows/inspect-grouped-welcome.yml
          rm scripts/apply-grouped-welcome.py.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: group welcome messages within fixed window"
          git push origin HEAD:agent/grouped-welcome-default
