name: Fix no-backup residuals

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/refactor-neurobot-community' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout community branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove remaining backup calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('src/admin/server.ts')
          server_text = server.read_text(encoding='utf-8')
          old_import = "import { basename, dirname, join, resolve } from 'node:path';"
          new_import = "import { basename, join, resolve } from 'node:path';"
          if old_import not in server_text:
              raise SystemExit('No se encontró el import de dirname esperado.')
          server.write_text(server_text.replace(old_import, new_import, 1), encoding='utf-8')

          manager = Path('src/core/multi-bot-manager.ts')
          manager_text = manager.read_text(encoding='utf-8')
          replacements = [
              (
                  '          const backupPath = await this.sessions.archive(duplicateBot);',
                  '          await this.sessions.clear(duplicateBot);',
              ),
              ("            result: 'archived',", "            result: 'cleared',"),
              ('              backupCreated: Boolean(backupPath),\n', ''),
              (
                  "            'La sesión temporal duplicada fue aislada sin afectar al asistente existente',",
                  "            'La sesión temporal duplicada fue eliminada sin afectar al asistente existente',",
              ),
          ]
          for old, new in replacements:
              count = manager_text.count(old)
              if count != 1:
                  raise SystemExit(f'Reemplazo residual inválido: {old!r}; coincidencias={count}')
              manager_text = manager_text.replace(old, new, 1)
          manager.write_text(manager_text, encoding='utf-8')
          PY

      - name: Format and commit
        shell: bash
        run: |
          npx prettier --write src/admin/server.ts src/core/multi-bot-manager.ts
          rm -f .github/workflows/fix-no-backup-residuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar residuos del archivado de sesiones"
          git push origin HEAD:agent/refactor-neurobot-community

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
