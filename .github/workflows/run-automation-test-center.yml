name: Build automation test center

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Generate centralized test module
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          root = Path('.')
          source = root / '.github' / 'workflows' / 'apply-automation-test-center.yml'
          text = source.read_text(encoding='utf-8')
          marker = "          AUTOMATION_TESTS_GZIP_BASE64: |\n"
          start = text.index(marker) + len(marker)
          end = text.index("        run: |\n", start)
          encoded = ''.join(line.strip() for line in text[start:end].splitlines() if line.strip())
          content = gzip.decompress(base64.b64decode(encoded))
          (root / 'public' / 'automation-tests.js').write_bytes(content)

          loader = root / 'public' / 'friendly-panel.js'
          loader_text = loader.read_text(encoding='utf-8')
          import_line = "void import('./automation-tests.js');"
          if import_line not in loader_text:
              loader.write_text(loader_text.rstrip() + '\n' + import_line + '\n', encoding='utf-8')

          source.unlink(missing_ok=True)
          (root / '.github' / 'workflows' / 'run-automation-test-center.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add centralized automation test center"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
