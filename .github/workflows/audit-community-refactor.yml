name: Audit Neurobot Community Refactor

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == '[audit-neurobot-community]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build audit report
        shell: bash
        run: |
          set +e
          : > community-audit.txt
          echo '# Repository files' >> community-audit.txt
          find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -print | sort >> community-audit.txt
          echo >> community-audit.txt

          echo '# Business and Meta/Cloud references' >> community-audit.txt
          grep -RInE --exclude-dir=.git --exclude='package-lock.json' \
            'WHATSAPP_CLOUD_API|Cloud API|Meta|business|mixed|privateMessages|private chat|chat privado|catalog|catálogo|menu|menú|business hours|horario|human assistance|atención humana|reservation|reserva|shipping|despacho|payment|pago|webhook|phoneNumberId|accessToken|verifyToken' \
            src public tests scripts docs README.md package.json .env.example 2>/dev/null >> community-audit.txt
          echo >> community-audit.txt

          echo '# Connector and adapter files' >> community-audit.txt
          find src tests -type f | grep -Ei 'cloud|meta|connector|adapter|business|catalog|menu|media|hours|request|reservation' | sort >> community-audit.txt
          echo >> community-audit.txt

          echo '# Package scripts and dependencies' >> community-audit.txt
          cat package.json >> community-audit.txt

      - name: Publish report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('community-audit.txt', 'utf8');
            const limit = 60000;
            if (report.length > limit) report = `${report.slice(0, limit)}\n\n[Informe truncado]`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
