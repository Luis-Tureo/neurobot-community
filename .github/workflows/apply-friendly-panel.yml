name: Aplicar panel amigable

on:
  push:
    branches: [main]
    paths:
      - .github/friendly-panel-trigger.txt
  pull_request:
    branches: [main]
    paths:
      - .github/friendly-panel-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Integrar navegación y módulos amigables
        run: python scripts/apply-friendly-panel.py

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/friendly-panel.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios validados en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/friendly-panel.js
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: ordenar y simplificar todos los módulos del panel"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
