name: Finalize scheduled welcome

on:
  push:
    branches:
      - feat/scheduled-welcome-runtime-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0

      - name: Apply final fixes
        run: python3 scripts/finalize-scheduled-welcome.py

      - name: Commit final fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalizar bienvenida agrupada por horarios"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2
