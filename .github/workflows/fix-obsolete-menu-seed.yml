name: Fix obsolete menu seed

on:
  push:
    branches:
      - agent/refactor-neurobot-community
    paths:
      - .github/workflows/fix-obsolete-menu-seed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-neurobot-community
          fetch-depth: 0

      - name: Remove obsolete private-menu seed
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/persistence/database.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = '    const initialMenu = this.db'
          end_marker = '\n  }\n\n  private seedBotScopedAutomationPlatform'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró exactamente el bloque obsoleto de menu_definitions')
          updated = text[:start] + text[end:]
          if updated.count('private seedBotScopedAutomationPlatform') != 1:
              raise SystemExit('El parche produjo una estructura inesperada')
          path.write_text(updated, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-obsolete-menu-seed.yml
          git add src/persistence/database.ts
          git commit -m "fix(database): stop seeding removed private menus"
          git push origin HEAD:agent/refactor-neurobot-community
