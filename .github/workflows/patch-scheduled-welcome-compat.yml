name: Patch scheduled welcome compatibility

on:
  push:
    branches:
      - feat/scheduled-welcome-runtime-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0

      - name: Apply compatibility patch
        run: python3 scripts/patch-scheduled-welcome-compat.py

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completar configuración de bienvenida por horario"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2
