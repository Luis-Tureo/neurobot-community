name: Verify GitHub CLI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-cli.yml'
  pull_request:
    paths:
      - '.github/workflows/github-cli.yml'

permissions:
  contents: read

jobs:
  verify-gh:
    name: Verify gh availability and authentication
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub CLI version
        run: gh --version

      - name: Verify GitHub authentication
        run: gh auth status

      - name: Verify repository access
        run: gh repo view "$GH_REPO" --json nameWithOwner,defaultBranchRef,visibility
