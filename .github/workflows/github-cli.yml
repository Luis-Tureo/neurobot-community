name: Apply Community Main Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-community-main-refactor
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply and validate refactor
        run: bash .github/scripts/apply-community-refactor.sh
