name: Aplicar simplificación del panel de IA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ai-panel-simplification.yml
      - scripts/apply-ai-panel-simplification.py
      - .github/ai-panel-trigger.txt
  pull_request:
    branches: [main]
    paths:
      - .github/ai-panel-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Simplificar módulo de inteligencia artificial
        run: python scripts/apply-ai-panel-simplification.py

      - name: Revisar diferencias
        run: |
          git diff --check
          git diff --stat

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar prueba específica
        run: npm test -- tests/ai-panel-simplification.test.ts

      - name: Ejecutar todas las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar cambios directamente en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/styles.css tests/ai-panel-simplification.test.ts
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que publicar."
          else
            git commit -m "feat: simplificar módulo de inteligencia artificial"
            git push origin main
          fi
