name: Inspect Community Boundaries

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event.issue.title == '[inspect-neurobot-community]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build focused report
        shell: bash
        run: |
          set +e
          : > boundary-report.txt

          section() { echo; echo "## $1"; }
          around() {
            file="$1"; pattern="$2";
            echo "### $file :: $pattern"
            grep -nEi "$pattern" "$file" 2>/dev/null | head -120 || true
          }

          section 'Domain types'
          around src/domain/types.ts 'business|mixed|private|catalog|menu|media|hours|request|reservation|cloud|connector|webhook|payment|shipping'

          section 'Application startup and instances'
          around src/index.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|webhook'
          around src/core/bot-instance.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|conversation'
          around src/core/multi-bot-manager.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|conversation'
          around src/core/assistant-module-visibility-service.ts 'business|mixed|private|catalog|menu|media|hours|request|automatic|poll|moderation'
          around src/core/profile-presets.ts 'business|mixed|store|restaurant|distributor|service|community|empty'

          section 'Admin server routes and schemas'
          grep -nE "app\.(get|post|put|patch|delete)\(" src/admin/server.ts | grep -Ei 'catalog|menu|media|hours|request|reservation|connector|webhook|cloud|business|transfer|private|shipping|payment' | head -250 || true
          around src/admin/server.ts 'WHATSAPP_CLOUD_API|BUSINESS_|business|mixed|privateMessages|privateChannel|webhook|phoneNumberId|accessToken|verifyToken'

          section 'Database methods and migrations'
          grep -nE '^  (create|update|delete|list|get|set|copy|transfer|archive|restore)[A-Za-z0-9_]+' src/persistence/database.ts | grep -Ei 'menu|catalog|media|hour|request|connector|business|conversation|private|transfer' | head -300 || true
          around src/persistence/database.ts 'WHATSAPP_CLOUD_API|BUSINESS_|private_business|private_channel|catalog_enabled|human_assistance|interactive_menus'

          section 'Public panel sections'
          grep -nE 'id="section-|data-section="' public/index.html | head -300 || true
          around public/index.html 'business|mixed|private|catalog|menu|media|hours|requests|reservation|connector|cloud|webhook|Meta|payment|shipping'

          section 'Panel functions'
          grep -nE '^(async )?function ' public/multibot-panel.js | grep -Ei 'menu|catalog|media|hour|request|connector|business|private|cloud|webhook|transfer' | head -250 || true
          around public/friendly-panel.js 'business|mixed|private|catalog|menu|media|hours|requests|community'

          section 'Environment and documentation'
          around .env.example 'META|CLOUD|WEBHOOK|PHONE_NUMBER|ACCESS_TOKEN|VERIFY_TOKEN|BUSINESS|PRIVATE'
          grep -RIlE 'WHATSAPP_CLOUD_API|Cloud API|Meta|perfil comercial|perfiles comerciales|modo negocio|modo mixto|catálogo|atención humana|reservas' docs README.md | sort || true

          section 'Business-specific source and test files'
          find src tests -type f | grep -Ei 'cloud|catalog|business-hours|conversation-flow|interactive-message|request|reservation' | sort || true
          grep -RIlE 'WHATSAPP_CLOUD_API|BUSINESS_PRIVATE|BUSINESS_MIXED|catalog|human assistance|atención humana|reservation|privateMessagesEnabled' tests | sort || true

          cat boundary-report.txt >/dev/null
        env:
          LC_ALL: C.UTF-8
      - name: Publish report
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const script = `
              section() { echo; echo "## $1"; }
              around() { file="$1"; pattern="$2"; echo "### $file :: $pattern"; grep -nEi "$pattern" "$file" 2>/dev/null | head -120 || true; }
              section 'Domain types'; around src/domain/types.ts 'business|mixed|private|catalog|menu|media|hours|request|reservation|cloud|connector|webhook|payment|shipping';
              section 'Application startup and instances'; around src/index.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|webhook'; around src/core/bot-instance.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|conversation'; around src/core/multi-bot-manager.ts 'cloud|connector|business|mixed|private|catalog|menu|hours|request|conversation'; around src/core/assistant-module-visibility-service.ts 'business|mixed|private|catalog|menu|media|hours|request|automatic|poll|moderation'; around src/core/profile-presets.ts 'business|mixed|store|restaurant|distributor|service|community|empty';
              section 'Admin server routes and schemas'; grep -nE "app\\.(get|post|put|patch|delete)\\(" src/admin/server.ts | grep -Ei 'catalog|menu|media|hours|request|reservation|connector|webhook|cloud|business|transfer|private|shipping|payment' | head -250 || true; around src/admin/server.ts 'WHATSAPP_CLOUD_API|BUSINESS_|business|mixed|privateMessages|privateChannel|webhook|phoneNumberId|accessToken|verifyToken';
              section 'Database methods and migrations'; grep -nE '^  (create|update|delete|list|get|set|copy|transfer|archive|restore)[A-Za-z0-9_]+' src/persistence/database.ts | grep -Ei 'menu|catalog|media|hour|request|connector|business|conversation|private|transfer' | head -300 || true; around src/persistence/database.ts 'WHATSAPP_CLOUD_API|BUSINESS_|private_business|private_channel|catalog_enabled|human_assistance|interactive_menus';
              section 'Public panel sections'; grep -nE 'id="section-|data-section="' public/index.html | head -300 || true; around public/index.html 'business|mixed|private|catalog|menu|media|hours|requests|reservation|connector|cloud|webhook|Meta|payment|shipping';
              section 'Panel functions'; grep -nE '^(async )?function ' public/multibot-panel.js | grep -Ei 'menu|catalog|media|hour|request|connector|business|private|cloud|webhook|transfer' | head -250 || true; around public/friendly-panel.js 'business|mixed|private|catalog|menu|media|hours|requests|community';
              section 'Environment and documentation'; around .env.example 'META|CLOUD|WEBHOOK|PHONE_NUMBER|ACCESS_TOKEN|VERIFY_TOKEN|BUSINESS|PRIVATE'; grep -RIlE 'WHATSAPP_CLOUD_API|Cloud API|Meta|perfil comercial|perfiles comerciales|modo negocio|modo mixto|catálogo|atención humana|reservas' docs README.md | sort || true;
              section 'Business-specific source and test files'; find src tests -type f | grep -Ei 'cloud|catalog|business-hours|conversation-flow|interactive-message|request|reservation' | sort || true; grep -RIlE 'WHATSAPP_CLOUD_API|BUSINESS_PRIVATE|BUSINESS_MIXED|catalog|human assistance|atención humana|reservation|privateMessagesEnabled' tests | sort || true;
            `;
            let report = execFileSync('bash', ['-lc', script], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
            if (report.length > 60000) report = `${report.slice(0,60000)}\n\n[Informe truncado]`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: report });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
