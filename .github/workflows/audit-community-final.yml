name: Apply validated Neurobot Community refactor

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  refactor:
    if: github.event.issue.title == '[audit-community-final]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply refactor and validate
        id: apply
        shell: bash
        run: |
          set +e
          report=/tmp/refactor-report.txt
          : > "$report"

          python - <<'PY' >> "$report" 2>&1
          from pathlib import Path

          source = Path('.github/workflows/agent-apply-main-refactor.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-refactor.py').write_text(code, encoding='utf-8')
          print(f'Extracted {len(lines)} Python lines.')
          PY
          extract_status=$?
          echo "extract_status=$extract_status" >> "$report"

          if [ "$extract_status" -eq 0 ]; then
            python /tmp/apply-refactor.py >> "$report" 2>&1
            patch_status=$?
          else
            patch_status=99
          fi
          echo "patch_status=$patch_status" >> "$report"

          if [ "$patch_status" -eq 0 ]; then
            npm ci >> "$report" 2>&1
            install_status=$?
          else
            install_status=99
          fi
          echo "install_status=$install_status" >> "$report"

          if [ "$install_status" -eq 0 ]; then
            npx prettier --write src public tests docs README.md .github/workflows/validate-main.yml >> "$report" 2>&1
            prettier_status=$?
            npm run check >> "$report" 2>&1
            check_status=$?
          else
            prettier_status=99
            check_status=99
          fi
          echo "prettier_status=$prettier_status" >> "$report"
          echo "check_status=$check_status" >> "$report"

          if [ "$patch_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$prettier_status" -eq 0 ] && [ "$check_status" -eq 0 ]; then
            rm -f .github/workflows/agent-apply-main-refactor.yml
            rm -f .github/workflows/agent-diagnose-main-refactor.yml
            rm -f .github/workflows/agent-community-audit.yml
            rm -f .github/workflows/audit-community-final.yml
            rm -f refactor-diagnostic.txt
            rm -rf agent-audit agent-transfer
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'refactor: modularize community automations and apply pending features'
            git push origin HEAD:main
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
          else
            cp "$report" refactor-diagnostic.txt
            git reset --hard HEAD
            cp "$report" refactor-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add refactor-diagnostic.txt
            git commit -m 'chore: publish refactor diagnostic'
            git push origin HEAD:main
            echo 'outcome=failure' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish result and close issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.apply.outputs.outcome }}
        with:
          script: |
            const fs = require('fs');
            let body = `Resultado de la refactorización: **${process.env.OUTCOME || 'unknown'}**.`;
            if (fs.existsSync('refactor-diagnostic.txt')) {
              let report = fs.readFileSync('refactor-diagnostic.txt', 'utf8');
              if (report.length > 55000) report = report.slice(-55000);
              body += `\n\n\`\`\`text\n${report}\n\`\`\``;
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Fail when validation failed
        if: steps.apply.outputs.outcome != 'success'
        run: exit 1
