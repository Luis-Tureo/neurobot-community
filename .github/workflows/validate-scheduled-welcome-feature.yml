name: Validate scheduled welcome feature

on:
  push:
    branches:
      - feat/scheduled-welcome-runtime-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run check

      - name: Record successful validation
        run: |
          set -euo pipefail
          VALIDATED_SHA=$(git rev-parse HEAD)
          rm -f .github/workflows/validate-scheduled-welcome-feature.yml
          printf 'Validated scheduled welcome feature at %s\n' "$VALIDATED_SHA" > docs/.scheduled-welcome-validation-passed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validar bienvenida programada completa"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2
