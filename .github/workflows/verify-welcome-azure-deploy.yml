name: Verify scheduled welcome Azure deployment

on:
  push:
    branches:
      - feat/scheduled-welcome-runtime-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0

      - name: Wait for deployed welcome UI
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://neurobot-community-a9ehergre8e9ehfy.chilecentral-01.azurewebsites.net"
          for attempt in $(seq 1 36); do
            HEALTH=$(curl --fail --silent --show-error --max-time 10 "$BASE_URL/api/health" 2>/dev/null || true)
            UI=$(curl --fail --silent --show-error --max-time 10 "$BASE_URL/welcome-schedule-ui.js" 2>/dev/null || true)
            if printf '%s' "$HEALTH" | grep -q '"ok"[[:space:]]*:[[:space:]]*true' \
              && printf '%s' "$UI" | grep -q 'Horarios de bienvenida' \
              && printf '%s' "$UI" | grep -q 'America/Santiago — Hora de Chile'; then
              echo "Azure ya sirve la interfaz de bienvenida programada."
              exit 0
            fi
            echo "Intento ${attempt}/36: esperando despliegue actualizado..."
            sleep 10
          done
          echo "El despliegue actualizado no estuvo visible dentro del tiempo de espera." >&2
          exit 1

      - name: Record deployment verification
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-welcome-azure-deploy.yml
          printf 'Azure serves scheduled welcome UI from main commit fa67f601df092d7a841d625946d477b22c68ef05\n' > docs/.scheduled-welcome-azure-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verificar despliegue Azure de bienvenida programada"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2
