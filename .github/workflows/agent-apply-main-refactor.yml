name: Apply main refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-apply-main-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply refactor and pending features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              content = read(path)
              if old not in content:
                  raise RuntimeError(f'Expected block not found in {path}: {old[:100]!r}')
              write(path, content.replace(old, new, 1))

          # Messaging abstraction: temporary, anonymizable history access.
          replace_once(
              'src/messaging/messaging-client.ts',
              "export type SelectableMenuPayload = Omit<InteractiveMenuPayload, 'kind'>;\n\nexport interface MessagingClient {",
              "export type SelectableMenuPayload = Omit<InteractiveMenuPayload, 'kind'>;\n\nexport type RecentGroupMessage = {\n  id: string;\n  body: string;\n  timestampMs: number;\n  fromMe: boolean;\n  participantId: string | null;\n};\n\nexport interface MessagingClient {",
          )
          replace_once(
              'src/messaging/messaging-client.ts',
              "  resolveWelcomeParticipants?(participantIds: string[]): Promise<WelcomeParticipant[]>;\n",
              "  resolveWelcomeParticipants?(participantIds: string[]): Promise<WelcomeParticipant[]>;\n  fetchRecentGroupMessages?(chatId: string, limit: number): Promise<RecentGroupMessage[]>;\n",
          )

          replace_once(
              'src/messaging/whatsapp-adapter.ts',
              "  MessagingClientEvents,\n  SelectableMenuPayload,\n} from './messaging-client.js';",
              "  MessagingClientEvents,\n  RecentGroupMessage,\n  SelectableMenuPayload,\n} from './messaging-client.js';",
          )
          replace_once(
              'src/messaging/whatsapp-adapter.ts',
              "  public async sendMedia(chatId: string, absolutePath: string, caption: string): Promise<void> {",
              """  public async fetchRecentGroupMessages(\n    chatId: string,\n    limit: number,\n  ): Promise<RecentGroupMessage[]> {\n    const client = this.requireReadyClient();\n    const chat = await client.getChatById(chatId);\n    const fetchMessages = Reflect.get(chat as object, 'fetchMessages');\n    if (typeof fetchMessages !== 'function') throw new Error('CHAT_HISTORY_UNAVAILABLE');\n    const result = await Reflect.apply(fetchMessages, chat, [\n      { limit: Math.max(1, Math.min(2000, limit)) },\n    ]);\n    if (!Array.isArray(result)) return [];\n    return result.flatMap((message, index): RecentGroupMessage[] => {\n      if (typeof message !== 'object' || message === null) return [];\n      const body = Reflect.get(message, 'body');\n      const timestamp = Reflect.get(message, 'timestamp');\n      const participantId =\n        getSerializedId(Reflect.get(message, 'author')) ??\n        getSerializedId(Reflect.get(message, 'from'));\n      return [\n        {\n          id: getSerializedId(Reflect.get(message, 'id')) ?? `history-${index}`,\n          body: typeof body === 'string' ? body.slice(0, 4000) : '',\n          timestampMs:\n            typeof timestamp === 'number' && Number.isFinite(timestamp)\n              ? timestamp * 1000\n              : Date.now(),\n          fromMe: Reflect.get(message, 'fromMe') === true,\n          participantId,\n        },\n      ];\n    });\n  }\n\n  public async sendMedia(chatId: string, absolutePath: string, caption: string): Promise<void> {""",
          )

          replace_once(
              'src/messaging/simulated-client.ts',
              "import type { MessagingClient, MessagingClientEvents } from './messaging-client.js';",
              "import type { MessagingClient, MessagingClientEvents, RecentGroupMessage } from './messaging-client.js';",
          )
          replace_once(
              'src/messaging/simulated-client.ts',
              "  public readonly welcomeParticipants = new Map<string, WelcomeParticipant>();\n",
              "  public readonly welcomeParticipants = new Map<string, WelcomeParticipant>();\n  public readonly recentGroupMessages = new Map<string, RecentGroupMessage[]>();\n",
          )
          replace_once(
              'src/messaging/simulated-client.ts',
              "  public async sendPoll(chatId: string, poll: NativePoll): Promise<void> {",
              """  public async fetchRecentGroupMessages(\n    chatId: string,\n    limit: number,\n  ): Promise<RecentGroupMessage[]> {\n    return (this.recentGroupMessages.get(chatId) ?? []).slice(-Math.max(1, limit));\n  }\n\n  public async sendPoll(chatId: string, poll: NativePoll): Promise<void> {""",
          )

          # Runtime integration: one digest scheduler per bot instance.
          replace_once(
              'src/core/bot-instance.ts',
              "import { ConversationFlowService } from './conversation-flow-service.js';",
              "import { ConversationFlowService } from './conversation-flow-service.js';\nimport { CommunityDigestService } from './community-digest-service.js';",
          )
          replace_once(
              'src/core/bot-instance.ts',
              "  private readonly automaticMessages: AutomaticMessageService;\n",
              "  private readonly automaticMessages: AutomaticMessageService;\n  private readonly communityDigests: CommunityDigestService;\n",
          )
          replace_once(
              'src/core/bot-instance.ts',
              """    this.automaticMessages = new AutomaticMessageService(database, client, logger, anonymizer, {\n      botId: bot.id,\n      ...(options.isPaused === undefined ? {} : { isPaused: options.isPaused }),\n    });\n""",
              """    this.automaticMessages = new AutomaticMessageService(database, client, logger, anonymizer, {\n      botId: bot.id,\n      ...(options.isPaused === undefined ? {} : { isPaused: options.isPaused }),\n    });\n    this.communityDigests = new CommunityDigestService(\n      database,\n      client,\n      provider,\n      logger,\n      anonymizer,\n      {\n        botId: bot.id,\n        ...(options.isPaused === undefined ? {} : { isPaused: options.isPaused }),\n      },\n    );\n""",
          )
          replace_once(
              'src/core/bot-instance.ts',
              "          this.automaticMessages.reconfigure();\n          this.pollScheduler.reconfigure();",
              "          this.automaticMessages.reconfigure();\n          this.communityDigests.reconfigure();\n          this.pollScheduler.reconfigure();",
          )
          replace_once(
              'src/core/bot-instance.ts',
              "      this.automaticMessages.start();\n      this.pollScheduler.start();",
              "      this.automaticMessages.start();\n      this.communityDigests.start();\n      this.pollScheduler.start();",
          )
          replace_once(
              'src/core/bot-instance.ts',
              "        this.automaticMessages.stop();\n        this.pollScheduler.stop();",
              "        this.automaticMessages.stop();\n        this.communityDigests.stop();\n        this.pollScheduler.stop();",
          )
          replace_once(
              'src/core/bot-instance.ts',
              "      this.automaticMessages.stop();\n      this.pollScheduler.stop();",
              "      this.automaticMessages.stop();\n      this.communityDigests.stop();\n      this.pollScheduler.stop();",
          )
          replace_once(
              'src/core/bot-instance.ts',
              """  public automaticMessageService(): AutomaticMessageService {\n    return this.automaticMessages;\n  }\n""",
              """  public automaticMessageService(): AutomaticMessageService {\n    return this.automaticMessages;\n  }\n\n  public communityDigestService(): CommunityDigestService {\n    return this.communityDigests;\n  }\n""",
          )

          replace_once(
              'src/core/multi-bot-manager.ts',
              "import type { AutomaticMessageService } from './automatic-message-service.js';",
              "import type { AutomaticMessageService } from './automatic-message-service.js';\nimport type { CommunityDigestService } from './community-digest-service.js';",
          )
          replace_once(
              'src/core/multi-bot-manager.ts',
              """  public automaticMessages(botId: string): AutomaticMessageService | null {\n    return this.instances.get(botId)?.automaticMessageService() ?? null;\n  }\n""",
              """  public automaticMessages(botId: string): AutomaticMessageService | null {\n    return this.instances.get(botId)?.automaticMessageService() ?? null;\n  }\n\n  public communityDigests(botId: string): CommunityDigestService | null {\n    return this.instances.get(botId)?.communityDigestService() ?? null;\n  }\n""",
          )

          # Admin API for configuration, tests and anonymized history download.
          replace_once(
              'src/admin/server.ts',
              "import type { AutomaticMessageService } from '../core/automatic-message-service.js';",
              "import type { AutomaticMessageService } from '../core/automatic-message-service.js';\nimport type { CommunityDigestService } from '../core/community-digest-service.js';",
          )
          replace_once(
              'src/admin/server.ts',
              "const automaticManualSendSchema = z\n",
              """const communityDigestConfigurationSchema = z\n  .object({\n    timezone: z.string().trim().min(1).max(80),\n    daily: z\n      .object({\n        enabled: z.boolean(),\n        sendTime: z.string().regex(/^(?:[01]\\d|2[0-3]):[0-5]\\d$/u),\n        toleranceMinutes: z.number().int().min(0).max(180),\n      })\n      .strict(),\n    weekly: z\n      .object({\n        enabled: z.boolean(),\n        weekday: z.enum(['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']),\n        sendTime: z.string().regex(/^(?:[01]\\d|2[0-3]):[0-5]\\d$/u),\n        toleranceMinutes: z.number().int().min(0).max(180),\n      })\n      .strict(),\n    maxMessages: z.number().int().min(20).max(2000),\n    maxCharacters: z.number().int().min(2000).max(100000),\n  })\n  .strict();\n\nconst communityDigestManualSchema = z\n  .object({\n    groupKey: z.string().length(20),\n    period: z.enum(['daily', 'weekly']),\n    confirmed: z.literal(true),\n  })\n  .strict();\n\nconst automaticManualSendSchema = z\n""",
          )
          replace_once(
              'src/admin/server.ts',
              "  automaticMessages?: AutomaticMessageService;\n",
              "  automaticMessages?: AutomaticMessageService;\n  communityDigests?: CommunityDigestService;\n",
          )

          digest_routes = """
          app.get(
            '/api/automatic-messages/digests',
            { preHandler: requireSession(sessions) },
            async (request, reply) => {
              const botId = parseBotIdQuery(request.query, context);
              const service = communityDigestsFor(context, botId);
              if (service === null) {
                return reply.code(503).send({
                  error: 'El servicio de resúmenes no está disponible.',
                  code: 'COMMUNITY_DIGEST_UNAVAILABLE',
                });
              }
              const groups = context.database.listBotGroups(botId, (identifier) =>
                context.anonymizer.identifier(identifier),
              );
              return {
                configuration: service.configuration(),
                schedulerStarted: service.isStarted(),
                authorizedGroups: groups
                  .filter((group) => group.active && !group.blocked && group.botIsMember === true)
                  .map((group) => ({ key: group.groupHash, name: group.name })),
                privacy: {
                  rawMessagesStored: false,
                  identifiersIncludedInExport: false,
                },
              };
            },
          );

          app.patch(
            '/api/automatic-messages/digests',
            { preHandler: [requireSession(sessions), requireCsrf(sessions)] },
            async (request, reply) => {
              const botId = parseBotIdQuery(request.query, context);
              const service = communityDigestsFor(context, botId);
              if (service === null) {
                return reply.code(503).send({
                  error: 'El servicio de resúmenes no está disponible.',
                  code: 'COMMUNITY_DIGEST_UNAVAILABLE',
                });
              }
              const configuration = communityDigestConfigurationSchema.parse(request.body);
              service.saveConfiguration(configuration);
              audit(context, 'community_digest_configuration_update', 'digests', 'ok', botId);
              return { updated: true, configuration };
            },
          );

          app.post(
            '/api/automatic-messages/digests/send-test',
            { preHandler: [requireSession(sessions), requireCsrf(sessions)] },
            async (request, reply) => {
              const botId = parseBotIdQuery(request.query, context);
              const service = communityDigestsFor(context, botId);
              if (service === null) {
                return reply.code(503).send({
                  error: 'El servicio de resúmenes no está disponible.',
                  code: 'COMMUNITY_DIGEST_UNAVAILABLE',
                });
              }
              const input = communityDigestManualSchema.parse(request.body);
              const groupId = context.database.resolveBotGroupKey(
                botId,
                input.groupKey,
                (identifier) => context.anonymizer.identifier(identifier),
              );
              if (groupId === null || !context.database.canBotSendToGroup(botId, groupId)) {
                return reply
                  .code(404)
                  .send({ error: 'El grupo no está disponible.', code: 'GROUP_NOT_AVAILABLE' });
              }
              const result = await service.sendManual(input.period, groupId);
              audit(
                context,
                'community_digest_manual_send',
                `${input.period}:${input.groupKey}`,
                result.status,
                botId,
              );
              const statusCode =
                result.status === 'SENT' ? 200 : result.status === 'SKIPPED' ? 409 : 502;
              return reply.code(statusCode).send(result);
            },
          );

          app.get(
            '/api/automatic-messages/digests/history',
            { preHandler: requireSession(sessions) },
            async (request, reply) => {
              const botId = parseBotIdQuery(request.query, context);
              const service = communityDigestsFor(context, botId);
              if (service === null) {
                return reply.code(503).send({
                  error: 'El servicio de resúmenes no está disponible.',
                  code: 'COMMUNITY_DIGEST_UNAVAILABLE',
                });
              }
              const input = z
                .object({
                  groupKey: z.string().length(20),
                  period: z.enum(['daily', 'weekly']),
                })
                .passthrough()
                .parse(request.query ?? {});
              const groupId = context.database.resolveBotGroupKey(
                botId,
                input.groupKey,
                (identifier) => context.anonymizer.identifier(identifier),
              );
              if (groupId === null || !context.database.canBotSendToGroup(botId, groupId)) {
                return reply
                  .code(404)
                  .send({ error: 'El grupo no está disponible.', code: 'GROUP_NOT_AVAILABLE' });
              }
              const content = await service.exportHistory(input.period, groupId);
              const filename = `historial-${input.period}-${new Date().toISOString().slice(0, 10)}.txt`;
              return reply
                .header('Content-Type', 'text/plain; charset=utf-8')
                .header('Content-Disposition', `attachment; filename="${filename}"`)
                .send(content);
            },
          );

          """
          replace_once(
              'src/admin/server.ts',
              "  app.get('/api/polls',",
              digest_routes + "  app.get('/api/polls',",
          )
          replace_once(
              'src/admin/server.ts',
              "function pollServicesFor(context: AdminServerContext, botId: string) {",
              """function communityDigestsFor(context: AdminServerContext, botId: string) {\n  return (\n    context.multiBotManager?.communityDigests(botId) ??\n    (botId === 'neurobot' ? context.communityDigests ?? null : null)\n  );\n}\n\nfunction pollServicesFor(context: AdminServerContext, botId: string) {""",
          )

          # UI loading and module exports.
          app_js = read('public/app.js')
          export_line = 'export { api, botScopedPath, state, showNotice, activatePanelSection };'
          if export_line not in app_js:
              write('public/app.js', app_js.rstrip() + '\n\n' + export_line + '\n')

          replace_once(
              'public/index.html',
              '    <link rel="stylesheet" href="/friendly-panel.css" />',
              '    <link rel="stylesheet" href="/friendly-panel.css" />\n    <link rel="stylesheet" href="/automation-lab.css" />',
          )
          replace_once(
              'public/index.html',
              '    <script type="module" src="/friendly-panel.js"></script>',
              '    <script type="module" src="/friendly-panel.js"></script>\n    <script type="module" src="/automation-lab.js"></script>',
          )

          readme = read('README.md')
          heading = '## Resúmenes comunitarios y centro de pruebas'
          if heading not in readme:
              write(
                  'README.md',
                  readme.rstrip()
                  + '\n\n'
                  + heading
                  + '\n\nEl panel incluye un **Centro de pruebas** que reúne bienvenida, saludo, reglas, encuestas, moderación y resúmenes en una sola vista. Los resúmenes diarios y semanales consultan temporalmente mensajes recientes, eliminan identificadores antes de usar IA y no guardan el historial bruto. Consulta `docs/RESUMENES_COMUNITARIOS.md`.\n',
              )

          # One canonical validation workflow; remove obsolete agent/audit workflows.
          write(
              '.github/workflows/validate-main.yml',
              """name: Validate main

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: validate-main-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: npm
                - run: npm ci
                - run: npm run check
          """.replace('          ', ''),
          )

          obsolete = [
              'agent-community-audit.yml',
              'agent-targeted-inspection.yml',
              'agent-extract-context.yml',
              'apply-panel-minimal-v2.yml',
              'audit-community-final.yml',
              'audit-community-refactor.yml',
              'deep-clean-community-only.yml',
              'fix-community-refactor-2.yml',
              'fix-community-refactor.yml',
              'fix-community-tests.yml',
              'inspect-community-boundaries.yml',
              'inspect-community-deep-cleanup.yml',
              'run-community-refactor.yml',
              'validate-community-refactor.yml',
          ]
          for name in obsolete:
              path = Path('.github/workflows') / name
              if path.exists():
                  path.unlink()
          for path in [
              Path('.github/panel-minimal-v2-trigger.txt'),
              Path('scripts/apply-panel-minimal-v2.py'),
          ]:
              if path.exists():
                  path.unlink()
          for directory in [Path('agent-audit'), Path('agent-transfer')]:
              if directory.exists():
                  shutil.rmtree(directory)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed code
        run: npx prettier --write src public tests docs README.md .github/workflows/validate-main.yml

      - name: Validate repository
        run: npm run check

      - name: Commit validated refactor to main
        shell: bash
        run: |
          rm -f .github/workflows/agent-apply-main-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: modularize community automations and apply pending features'
          git push origin HEAD:main
