name: Fix scheduled welcome activation race

on:
  push:
    branches:
      - feat/scheduled-welcome-runtime-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/scheduled-welcome-runtime-v2
          fetch-depth: 0
      - name: Apply activation fix
        run: python3 scripts/fix-welcome-activation-race.py
      - name: Commit activation fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir línea base al activar bienvenida"
          git push origin HEAD:feat/scheduled-welcome-runtime-v2
